Макроэлементы",question:"Какие из перечисленных элементов относят к макроэлементам в организме человека? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) бор","2) кобальт","3) магний","4) хлор","5) фосфор","6) селен"],answer:"345",explanation:"Макроэлементы — Mg, Cl, P и другие в концентрации >0,01%. Микро — бор, кобальт, селен."},{id:2090,theme:"Биосинтез белка / Участники процесса",question:"Какие структуры и вещества непосредственно участвуют в биосинтезе белка в клетке? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) липиды клеточной мембраны","2) ферменты (аминоацил-тРНК-синтетазы, полимеразы)","3) молекулы РНК (мРНК, тРНК, рРНК)","4) глюкоза как мономер","5) аминокислоты","6) молекулы холестерина"],answer:"235",explanation:"Биосинтез требует ферментов, всех типов РНК и аминокислот как субстратов."},{id:2372,theme:"Обмен веществ / Превращения веществ",question:"Какие превращения веществ характерны для организма человека? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) гликогена в глюкозу при снижении сахара крови","2) белков напрямую в молекулы крахмала","3) ДНК напрямую в липиды без участия РНК","4) глицерина жиров в глюкозу при голодании","5) атмосферного азота напрямую в белки человека","6) избытка глюкозы в жиры (липогенез)"],answer:"146",explanation:"Характерны гликогенолиз (1), глюконеогенез из глицерина (4), липогенез (6)."},{id:2378,theme:"Опорно-двигательная система / Скелет человека",question:"Какие особенности строения скелета характерны только для человека в связи с прямохождением? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) сводчатая стопа","2) наличие хвостового отдела","3) S-образный позвоночник с четырьмя изгибами","4) широкий чашевидный таз","5) наличие когтей на пальцах","6) сплошной волосяной покров"],answer:"134",explanation:"Адаптации к прямохождению: свод стопы, S-изгибы позвоночника, широкий таз."},{id:2380,theme:"Внутренняя среда организма",question:"Какие компоненты относят к внутренней среде организма человека? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) цитоплазма клеток","2) кровь","3) содержимое желудка","4) лимфа","5) тканевая жидкость","6) воздух в легочных альвеолах"],answer:"245",explanation:"Внутренняя среда: кровь, лимфа, тканевая жидкость."},{id:2382,theme:"Органы чувств / Среднее ухо",question:"Какие структуры относят к среднему уху человека? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) овальное окно (граница со внутренним ухом)","2) улитка","3) стремечко","4) наковальня","5) полукружные каналы","6) молоточек"],answer:"346",explanation:"Среднее ухо содержит три слуховые косточки: молоточек, наковальня, стремечко."},{id:39090,theme:"Нервная система / Спинной мозг",question:"Какие утверждения характерны для серого вещества спинного мозга? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) состоит из тел нейронов и дендритов","2) состоит преимущественно из миелинизированных волокон","3) расположено вокруг центрального канала","4) на поперечном срезе имеет форму бабочки","5) образует наружный слой спинного мозга","6) образовано только аксонами двигательных нейронов"],answer:"134",explanation:"Серое вещество — тела нейронов, вокруг канала, форма бабочки на срезе."},{id:39091,theme:"Вегетативная НС / Симпатический отдел",question:"Какие эффекты характерны для симпатической нервной системы? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) усиливает вентиляцию легких и расширяет бронхи","2) сужает зрачки","3) усиливает перистальтику кишечника","4) угнетает секрецию пищеварительных желез","5) замедляет ритм сердца","6) расширяет зрачки"],answer:"146",explanation:"Симпатика — система стресса: усиливает дыхание (1), тормозит пищеварение (4), расширяет зрачки (6)."},{id:39092,theme:"Высшая нервная деятельность / Условные рефлексы",question:"Какие признаки характерны для условных рефлексов? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) являются врожденными и постоянными","2) характерны для всех особей вида","3) формируются в процессе индивидуального развития","4) не передаются по наследству, могут угасать","5) имеют постоянные рефлекторные дуги, заложенные генетически","6) обеспечивают приспособление организма к меняющимся условиям среды"],answer:"346",explanation:"Условные рефлексы индивидуальны, не наследуются, обеспечивают адаптацию."},{id:39192,theme:"Дыхательная система / Носовая полость",question:"Какие процессы происходят с воздухом в носовой полости человека? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) обогащается углекислым газом","2) происходит газообмен с кровью","3) фильтруется от пыли и микроорганизмов","4) согревается","5) увлажняется","6) образуются голосовые звуки"],answer:"345",explanation:"В носовой полости воздух фильтруется, согревается, увлажняется."},{id:40572,theme:"Пищеварительная система / Ротовая полость",question:"Какие процессы происходят с пищей в ротовой полости человека? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) механическое измельчение зубами","2) расщепление белков до аминокислот","3) первичное обеззараживание лизоцимом слюны","4) всасывание большей части воды","5) расщепление клетчатки бактериями","6) начало расщепления крахмала амилазой"],answer:"136",explanation:"В ротовой полости: измельчение (1), обеззараживание (3), начало переваривания крахмала (6)."},{id:40602,theme:"Ткани / Эпителиальная ткань",question:"Какие функции характерны для эпителиальной ткани? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) образует покровы тела и слизистых","2) обеспечивает сократимость сердца","3) выстилает полости внутренних органов и сосудов","4) образует сухожилия","5) обладает секреторной функцией (железистый эпителий)","6) проводит нервные импульсы"],answer:"135",explanation:"Эпителий: покровная (1), выстилающая (3), секреторная (5)."},{id:40656,theme:"Пищеварительная система / Печень",question:"Какие функции выполняет печень человека? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) вырабатывает желчь, эмульгирующую жиры","2) выполняет барьерную функцию, обезвреживая токсины","3) вырабатывает инсулин","4) участвует в обмене жиров, белков и углеводов","5) вырабатывает пищеварительный сок пепсин","6) является местом газообмена"],answer:"124",explanation:"Печень: желчь (1), барьерная (2), метаболическая (4)."},{id:41685,theme:"ВНД / Сравнение рефлексов",question:"Чем условные рефлексы отличаются от безусловных? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) являются врожденными","2) передаются по наследству","3) формируются в процессе индивидуального развития","4) вырабатываются в течение жизни особи","5) постоянны и не угасают","6) обеспечивают приспособление к новым условиям среды"],answer:"346",explanation:"Условные рефлексы формируются индивидуально (3), в течение жизни (4), для адаптации (6)."},{id:1372,theme:"Заболевания / Грипп, ОРВИ",question:"Какие симптомы характерны для гриппа? Выберите три верных ответа из шести и запишите цифры, под которыми они указаны.",options:["1) высокая температура 38–39°C","2) сыпь на коже в виде пятен","3) сильная головная боль, боль в мышцах","4) увеличение лимфоузлов шеи","5) резкая боль в животе без температуры","6) резкая слабость, утомляемость"],answer:"136",explanation:"Для гриппа характерны высокая температура, головная и мышечная боль, выраженная слабость."},{id:345,theme:"ВНД / Примеры условных рефлексов",question:"Какие примеры рефлексов животных и человека следует отнести к условным рефлексам? Выбери
